name: tvmaze_app
description: "A TV show discovery app using the TVMaze API and the BLoC pattern."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  shared_preferences: ^2.5.3
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
